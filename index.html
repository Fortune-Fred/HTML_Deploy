<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>工具雅集</title>
<meta name="theme-color" content="#221913">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工具雅集">
<link rel="apple-touch-icon" href="icons/home-180.png">
<link rel="icon" type="image/png" href="icons/home-180.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#221913; --card:#2e2419; --edge:#3c2f1f;
    --ink:#efe4d0; --dim:#b3a48c; --faint:#8a7c66;
    --warm:#d9a441; --warm2:#e8c169;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Noto Sans TC','PingFang TC',sans-serif;font-weight:300;
    min-height:100vh;
    padding:env(safe-area-inset-top) 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;}
  header{padding:48px 8px 10px;text-align:center;}
  .eyebrow{font-size:11px;letter-spacing:.45em;color:var(--warm);font-weight:500;margin-bottom:12px;text-indent:.45em;}
  h1{font-family:'Noto Serif TC','Songti TC','PMingLiU',serif;font-weight:900;font-size:32px;letter-spacing:.18em;text-indent:.18em;}
  .sub{color:var(--dim);font-size:13px;margin-top:10px;line-height:1.8;letter-spacing:.06em;}
  .divider{
    display:flex;align-items:center;gap:12px;margin:26px auto 22px;max-width:300px;
    color:var(--warm);opacity:.75;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--edge));}
  .divider::after{background:linear-gradient(90deg,var(--edge),transparent);}
  .divider span{font-size:10px;transform:rotate(45deg);}

  .tools{display:flex;flex-direction:column;gap:14px;padding-bottom:30px;}
  a.tool{
    display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--ink);
    background:var(--card);border:1px solid var(--edge);border-radius:16px;
    padding:18px 18px;position:relative;overflow:hidden;
    transition:border-color .15s, transform .1s;
  }
  a.tool:active{transform:scale(.985);border-color:var(--warm);}
  .seal{
    flex:0 0 auto;width:58px;height:58px;border-radius:50%;
    border:1.5px solid rgba(217,164,65,.55);
    display:flex;align-items:center;justify-content:center;position:relative;
    background:radial-gradient(circle at 50% 42%, rgba(217,164,65,.14), rgba(217,164,65,.03) 70%);
  }
  .seal::after{
    content:"";position:absolute;inset:4px;border-radius:50%;
    border:1px solid rgba(217,164,65,.22);
  }
  .seal b{
    font-family:'Noto Serif TC','Songti TC','PMingLiU',serif;font-weight:900;
    font-size:26px;color:var(--warm);line-height:1;
  }
  .tinfo{flex:1;min-width:0;}
  .tname{
    font-family:'Noto Serif TC','Songti TC','PMingLiU',serif;font-weight:700;
    font-size:17.5px;letter-spacing:.06em;color:var(--ink);
  }
  .tdesc{font-size:12px;color:var(--faint);margin-top:5px;line-height:1.65;letter-spacing:.03em;}
  .go{
    flex:0 0 auto;color:var(--warm);font-size:15px;opacity:.8;
    font-family:'Noto Sans TC',sans-serif;
  }

  footer{
    text-align:center;color:var(--faint);font-size:11px;letter-spacing:.2em;
    padding-top:8px;
  }
  footer .dot{color:var(--warm);margin:0 8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">隨 身 工 具 集</div>
    <h1>工具雅集</h1>
    <p class="sub">輕觸卡片開啟工具</p>
  </header>

  <div class="divider"><span>◆</span></div>

  <nav class="tools">

    <a class="tool" href="老山檀品香評測表_3.html">
      <span class="seal"><b>香</b></span>
      <span class="tinfo">
        <span class="tname">老山檀 · 品香評測表</span>
        <span class="tdesc" style="display:block">五段溫度香氣打分、多樣品比對、一鍵產生評測圖卡</span>
      </span>
      <span class="go">❯</span>
    </a>

    <a class="tool" href="金錢卦-單機版.html">
      <span class="seal"><b>卦</b></span>
      <span class="tinfo">
        <span class="tname">金錢卦 · 六爻起卦</span>
        <span class="tdesc" style="display:block">三枚銅錢六擲成卦，動爻變卦解讀、卦象記錄與圖卡</span>
      </span>
      <span class="go">❯</span>
    </a>

    <!-- 新增工具範本：複製下面區塊並修改連結、字、名稱、說明即可
    <a class="tool" href="新工具.html">
      <span class="seal"><b>字</b></span>
      <span class="tinfo">
        <span class="tname">工具名稱</span>
        <span class="tdesc" style="display:block">工具說明文字</span>
      </span>
      <span class="go">❯</span>
    </a>
    -->

  </nav>

  <footer>雅集<span class="dot">·</span>藏器於身</footer>
</div>
</body>
</html>
