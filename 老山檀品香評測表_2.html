<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老山檀・品香評測表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#221913; --card:#2e2419; --edge:#3c2f1f;
    --ink:#efe4d0; --dim:#b3a48c; --faint:#8a7c66;
    --cool:#8fbfae; --warm:#d9a441; --hot:#c25a2e; --neg:#c98a7a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-weight:300;padding-bottom:90px;}
  .wrap{max-width:560px;margin:0 auto;padding:0 12px;}
  header{padding:36px 8px 18px;}
  .eyebrow{font-size:11px;letter-spacing:.35em;color:var(--warm);font-weight:500;margin-bottom:8px;}
  h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:24px;letter-spacing:.05em;}
  .sub{color:var(--dim);font-size:12.5px;margin-top:8px;line-height:1.7;}
  .sub b{color:var(--warm);font-weight:500;}
  .envtag{
    display:inline-block;margin-top:10px;font-size:11px;letter-spacing:.05em;
    color:var(--faint);border:1px solid var(--edge);border-radius:20px;padding:3px 12px;
  }

  .samples{display:flex;gap:8px;overflow-x:auto;padding:14px 4px 10px;scrollbar-width:none;}
  .samples::-webkit-scrollbar{display:none;}
  .schip{
    flex:0 0 auto;padding:7px 16px;border-radius:20px;font-size:13.5px;
    background:var(--card);border:1px solid var(--edge);color:var(--dim);cursor:pointer;white-space:nowrap;
  }
  .schip.on{background:rgba(217,164,65,.16);border-color:var(--warm);color:var(--warm);font-weight:500;}
  .schip.add{color:var(--faint);border-style:dashed;}
  .sname-row{display:flex;gap:8px;padding:2px 4px 10px;align-items:center;}
  .sname-row input{
    flex:1;background:var(--card);border:1px solid var(--edge);border-radius:8px;
    color:var(--ink);font-size:14px;padding:8px 12px;font-family:inherit;
  }
  .sname-row button{
    background:none;border:1px solid var(--edge);border-radius:8px;color:var(--neg);
    font-size:12px;padding:8px 12px;cursor:pointer;font-family:inherit;white-space:nowrap;
  }

  .legend{
    display:flex;gap:14px;flex-wrap:wrap;padding:8px 6px 6px;
    font-size:11.5px;color:var(--faint);letter-spacing:.05em;
  }
  .legend span b{font-weight:500;}
  .lg1 b{color:var(--dim);} .lg2 b{color:var(--warm);} .lg3 b{color:#e8c169;}

  .modebar{
    display:flex;align-items:center;gap:8px;margin:8px 6px 14px;
    background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:10px 14px;
  }
  .modebar input{width:16px;height:16px;accent-color:var(--warm);}
  .modebar label{font-size:12.5px;color:var(--dim);flex:1;}
  .modebar label b{color:var(--ink);font-weight:500;}

  table{width:100%;border-collapse:collapse;}
  thead th{
    font-size:11px;font-weight:500;color:var(--faint);letter-spacing:.05em;
    padding:6px 0 8px;text-align:center;position:sticky;top:0;background:var(--bg);z-index:5;
  }
  thead th:first-child{text-align:left;padding-left:8px;}
  .cat td{
    font-family:'Noto Serif TC',serif;font-weight:700;font-size:14px;letter-spacing:.15em;
    color:var(--warm);padding:22px 8px 8px;border-bottom:1px solid var(--edge);
  }
  .cat.negcat td{color:var(--neg);}
  .item td:first-child{
    font-size:13px;color:var(--ink);padding:9px 4px 9px 8px;line-height:1.4;width:34%;
  }
  .item .hint{display:block;font-size:10.5px;color:var(--faint);line-height:1.4;}
  .item{border-bottom:1px solid rgba(60,47,31,.5);}
  .cell{text-align:center;padding:4px 2px;}
  .mark{
    width:38px;height:38px;border-radius:9px;border:1px solid var(--edge);
    background:rgba(239,228,208,.03);color:transparent;font-size:15px;cursor:pointer;
    font-family:inherit;transition:background .12s;
  }
  .mark.m1{color:var(--dim);background:rgba(179,164,140,.1);border-color:var(--dim);}
  .mark.m2{color:var(--warm);background:rgba(217,164,65,.14);border-color:var(--warm);}
  .mark.m3{color:#e8c169;background:rgba(217,164,65,.3);border-color:#e8c169;font-weight:700;}
  .negitem .mark.m1,.negitem .mark.m2,.negitem .mark.m3{
    color:var(--neg);background:rgba(168,58,36,.16);border-color:var(--neg);
  }

  .notes-box{margin:26px 4px 0;}
  .notes-box label{font-size:12px;letter-spacing:.25em;color:var(--faint);display:block;margin-bottom:8px;}
  textarea{
    width:100%;min-height:88px;background:var(--card);border:1px solid var(--edge);
    border-radius:12px;color:var(--ink);font-size:14px;line-height:1.7;
    padding:12px 14px;font-family:inherit;resize:vertical;
  }
  .savebar{
    position:fixed;bottom:0;left:0;right:0;background:rgba(34,25,19,.94);
    backdrop-filter:blur(8px);border-top:1px solid var(--edge);padding:10px 14px;
    display:flex;justify-content:center;gap:8px;z-index:20;
  }
  .savebar button{
    font-family:inherit;font-size:13px;letter-spacing:.04em;cursor:pointer;
    border-radius:22px;padding:10px 16px;border:none;flex:1;max-width:150px;
  }
  .savebar .ghost{background:none;border:1px solid var(--edge);color:var(--dim);font-weight:400;}
  .savebar .secondary{background:none;border:1px solid var(--warm);color:var(--warm);font-weight:500;}
  .savebar .primary{background:var(--warm);color:#221913;font-weight:700;}
  .toast{
    position:fixed;bottom:78px;left:50%;transform:translateX(-50%);
    background:var(--warm);color:#221913;font-size:13px;font-weight:500;
    padding:8px 20px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30;
    white-space:nowrap;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">印度老山檀 ・ 專業品香</div>
    <h1>香氣評測打勾表</h1>
    <p class="sub">切換樣品分頁後點格子打分：<b>一下 ✓ 弱</b>、<b>兩下 ✓✓ 中</b>、<b>三下 ● 強</b>、四下清除。</p>
    <span class="envtag" id="envtag">偵測中…</span>
  </header>

  <div class="samples" id="samples"></div>
  <div class="sname-row">
    <input id="sname" placeholder="樣品名稱（例：沉水老料 #1）" maxlength="30">
    <button id="del">刪除樣品</button>
  </div>

  <div class="legend">
    <span class="lg1"><b>✓</b> 弱</span>
    <span class="lg2"><b>✓✓</b> 中</span>
    <span class="lg3"><b>●</b> 強</span>
    <span style="color:var(--neg)">紅色＝負面項</span>
  </div>

  <div class="modebar">
    <input type="checkbox" id="compactMode" checked>
    <label for="compactMode"><b>精簡摘要圖</b> — 勾選項目多時建議開啟，圖片會壓縮成固定大小的熱區總覽＋重點強項，而不是逐項長清單</label>
  </div>

  <table id="grid">
    <thead>
      <tr>
        <th>香氣項目</th>
        <th>生聞<br>20-30°</th>
        <th>手溫<br>~35°</th>
        <th>低溫熏<br>60-90°</th>
        <th>高溫熏<br>100-140°</th>
        <th>明火</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="notes-box">
    <label>品評備註（此樣品）</label>
    <textarea id="notes" placeholder="例：低溫熏 15 分鐘後涼轉甜，尾段膏脂感明顯…"></textarea>
  </div>
</div>

<div class="savebar">
  <button class="ghost" id="reset">清空</button>
  <button class="secondary" id="genimg">產生圖片</button>
  <button class="primary" id="save">存檔</button>
</div>
<div class="toast" id="toast">已儲存</div>

<script>
const CATS = [
  {name:"甜香系", short:"甜香", neg:false, items:[
    ["奶香","熱鮮奶・奶皮・煉乳"],
    ["奶油香","無鹽奶油的油潤甜"],
    ["蜂蜜香","溫熱蜂蜜的花蜜甜"],
    ["黑糖味","黑糖・焦糖深色暖甜"],
    ["果甜","熟果・蜜餞（頂級料少見）"],
  ]},
  {name:"涼香系", short:"涼香", neg:false, items:[
    ["薄荷涼","喉糖式溫和清涼"],
    ["龍腦涼","冰片感・鼻腔後段鑽涼"],
    ["草本涼","羅漢果・青草茶式涼意"],
  ]},
  {name:"藥香系", short:"藥香", neg:false, items:[
    ["甘草味","先甜後微苦帶涼"],
    ["當歸味","中藥房式甜苦藥根香"],
    ["杏仁味","帶殼杏仁・杏仁茶微苦"],
    ["陳皮味","老陳皮甘苦柑韻"],
  ]},
  {name:"木質系", short:"木質", neg:false, items:[
    ["檀木本香","乾淨木質基調"],
    ["老木陳香","老家具・老倉庫沉靜陳氣"],
    ["粉質感","藕粉・爽身粉乾粉香"],
  ]},
  {name:"脂香系", short:"脂香", neg:false, items:[
    ["膏脂感","香氣油潤如膏的稠度"],
    ["蠟質香","蜂蠟・老蠟溫潤氣息"],
    ["油脂香","加熱時油分釋出的豐腴"],
  ]},
  {name:"辛香系", short:"辛香", neg:false, items:[
    ["辛香料味","微胡椒・肉桂式暖辛"],
    ["煙燻味","淡煙感・燻烤氣"],
  ]},
  {name:"異雜氣（缺陷）", short:"異雜氣", neg:true, items:[
    ["生木氣","新料青澀木頭味"],
    ["酸氣","發酵酸・悶酸"],
    ["霉味","受潮霉變"],
    ["土腥味","埋藏料・劣質料"],
    ["香精味","泡油料的化學假甜"],
    ["燥氣","衝鼻刺激・聞久頭暈"],
  ]},
  {name:"綜合表現", short:"綜合", neg:false, items:[
    ["香氣層次","前中尾調分明有變化"],
    ["擴散力","空間穿透與瀰漫程度"],
    ["留香度","餘韻持續時間"],
    ["醇淨度","乾淨無雜・圓融不散"],
    ["靜氣感","聞之沉靜安定"],
  ]},
];
const TEMPS = 5;
const TEMP_LABELS = ["生聞","手溫","低熏","高熏","明火"];
const MARKS = ["","✓","✓✓","●"];
const KEY = "laoshan-eval-v1";

let db = {samples:[{name:"樣品一",marks:{},notes:""}],cur:0};

function itemId(ci,ii){return ci+"-"+ii;}

/* ---------- 儲存：Claude.ai 內用雲端 window.storage，其餘環境（如 GitHub Pages）自動退回 localStorage ---------- */
const hasCloudStorage = (typeof window.storage !== "undefined" && window.storage !== null);

async function storageSet(key, value){
  if(hasCloudStorage){
    try{ return await window.storage.set(key, value); }catch(e){ return null; }
  }
  try{ localStorage.setItem(key, value); return {key,value}; }catch(e){ return null; }
}
async function storageGet(key){
  if(hasCloudStorage){
    try{ return await window.storage.get(key); }catch(e){ return null; }
  }
  try{
    const v = localStorage.getItem(key);
    return v !== null ? {key,value:v} : null;
  }catch(e){ return null; }
}

/* ---------- 介面渲染 ---------- */
function renderSamples(){
  const box = document.getElementById("samples");
  box.innerHTML = "";
  db.samples.forEach((s,i)=>{
    const c = document.createElement("div");
    c.className = "schip"+(i===db.cur?" on":"");
    c.textContent = s.name || ("樣品"+(i+1));
    c.onclick = ()=>{db.cur=i;renderAll();};
    box.appendChild(c);
  });
  const add = document.createElement("div");
  add.className = "schip add";
  add.textContent = "＋ 新增樣品";
  add.onclick = ()=>{
    db.samples.push({name:"樣品"+(db.samples.length+1),marks:{},notes:""});
    db.cur = db.samples.length-1;
    renderAll();
  };
  box.appendChild(add);
  document.getElementById("sname").value = db.samples[db.cur].name;
  document.getElementById("notes").value = db.samples[db.cur].notes||"";
}

function renderGrid(){
  const tb = document.getElementById("tbody");
  tb.innerHTML = "";
  const s = db.samples[db.cur];
  CATS.forEach((cat,ci)=>{
    const tr = document.createElement("tr");
    tr.className = "cat"+(cat.neg?" negcat":"");
    tr.innerHTML = "<td colspan='6'>"+cat.name+"</td>";
    tb.appendChild(tr);
    cat.items.forEach((it,ii)=>{
      const r = document.createElement("tr");
      r.className = "item"+(cat.neg?" negitem":"");
      let cells = "<td>"+it[0]+"<span class='hint'>"+it[1]+"</span></td>";
      for(let t=0;t<TEMPS;t++){
        const v = (s.marks[itemId(ci,ii)]||[0,0,0,0,0])[t];
        cells += "<td class='cell'><button class='mark m"+v+"' data-ci='"+ci+"' data-ii='"+ii+"' data-t='"+t+"'>"+MARKS[v]+"</button></td>";
      }
      r.innerHTML = cells;
      tb.appendChild(r);
    });
  });
  tb.querySelectorAll(".mark").forEach(btn=>{
    btn.onclick = ()=>{
      const {ci,ii,t} = btn.dataset;
      const id = itemId(ci,ii);
      const s = db.samples[db.cur];
      if(!s.marks[id]) s.marks[id] = [0,0,0,0,0];
      s.marks[id][t] = (s.marks[id][t]+1)%4;
      const v = s.marks[id][t];
      btn.className = "mark m"+v;
      btn.textContent = MARKS[v];
    };
  });
}

function renderAll(){renderSamples();renderGrid();}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1600);
}

document.getElementById("sname").oninput = e=>{
  db.samples[db.cur].name = e.target.value;
  renderSamples();
};
document.getElementById("notes").oninput = e=>{
  db.samples[db.cur].notes = e.target.value;
};
document.getElementById("del").onclick = ()=>{
  if(db.samples.length<=1){toast("至少保留一個樣品");return;}
  if(!confirm("刪除「"+(db.samples[db.cur].name)+"」的所有評測？")) return;
  db.samples.splice(db.cur,1);
  db.cur = Math.max(0,db.cur-1);
  renderAll();
};
document.getElementById("reset").onclick = ()=>{
  if(!confirm("清空此樣品的所有打勾與備註？")) return;
  db.samples[db.cur].marks = {};
  db.samples[db.cur].notes = "";
  renderAll();
};
document.getElementById("save").onclick = async ()=>{
  const r = await storageSet(KEY, JSON.stringify(db));
  toast(r ? "已儲存" : "儲存失敗，請重試");
};

/* ---------- 共用繪圖工具 ---------- */
function wrapCJK(ctx, text, maxWidth){
  const lines = [];
  let line = "";
  for(const ch of String(text)){
    const test = line + ch;
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = ch;
    } else {
      line = test;
    }
  }
  if(line) lines.push(line);
  return lines;
}
function drawSpaced(ctx, text, x, y, gap){
  let cx = x;
  for(const ch of text){
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + gap;
  }
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function levelColor(level, neg){
  if(neg){
    if(level===0) return {bg:"rgba(239,228,208,0.04)", fg:"#5c4d3c", bd:"rgba(60,47,31,0.9)"};
    if(level===1) return {bg:"rgba(168,58,36,0.18)", fg:"#c98a7a", bd:"rgba(168,58,36,0.4)"};
    if(level===2) return {bg:"rgba(168,58,36,0.32)", fg:"#e08a72", bd:"rgba(168,58,36,0.6)"};
    return {bg:"rgba(168,58,36,0.5)", fg:"#f2ab98", bd:"rgba(168,58,36,0.8)"};
  }
  if(level===0) return {bg:"rgba(239,228,208,0.04)", fg:"#5c4d3c", bd:"rgba(60,47,31,0.9)"};
  if(level===1) return {bg:"rgba(179,164,140,0.16)", fg:"#b3a48c", bd:"rgba(179,164,140,0.4)"};
  if(level===2) return {bg:"rgba(217,164,65,0.22)", fg:"#d9a441", bd:"rgba(217,164,65,0.55)"};
  return {bg:"rgba(217,164,65,0.4)", fg:"#e8c169", bd:"rgba(217,164,65,0.8)"};
}

/* header 共用 */
function drawHeader(ctx, sample, W, PAD){
  let y = PAD;
  ctx.textBaseline = "alphabetic";
  ctx.textAlign = "left";
  ctx.font = '600 13px "Noto Serif TC", serif';
  ctx.fillStyle = "#d9a441";
  drawSpaced(ctx, "印度老山檀 ・ 品香評測記錄", PAD, y+13, 2);
  y += 32;
  ctx.font = '900 30px "Noto Serif TC", serif';
  ctx.fillStyle = "#efe4d0";
  ctx.fillText(sample.name || "未命名樣品", PAD, y+28);
  y += 42;
  const dateStr = new Date().toLocaleDateString("zh-TW", {year:"numeric",month:"2-digit",day:"2-digit"});
  ctx.font = '400 13px "Noto Sans TC", sans-serif';
  ctx.fillStyle = "#8a7c66";
  ctx.fillText("產生時間 "+dateStr, PAD, y+13);
  y += 32;
  ctx.strokeStyle = "#3c2f1f";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke();
  y += 26;
  return y;
}
function drawFooterFrom(ctx, y, W, PAD){
  y += 8;
  ctx.strokeStyle = "#3c2f1f";
  ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke();
  y += 24;
  ctx.font = '400 11px "Noto Sans TC", sans-serif';
  ctx.fillStyle = "#8a7c66";
  ctx.textAlign = "center";
  ctx.fillText("老山檀品香評測表", W/2, y+11);
  ctx.textAlign = "left";
  y += 30;
  return y;
}
function drawNotesFrom(ctx, y, W, PAD, contentW, sample){
  if(!(sample.notes && sample.notes.trim())) return y;
  y += 10;
  ctx.font = '700 13px "Noto Serif TC", serif';
  ctx.fillStyle = "#d9a441";
  drawSpaced(ctx, "品評備註", PAD, y+13, 3);
  y += 28;
  ctx.font = '400 15px "Noto Sans TC", sans-serif';
  ctx.fillStyle = "#dcd0ba";
  const noteLines = wrapCJK(ctx, sample.notes.trim(), contentW);
  noteLines.forEach(line=>{
    ctx.fillText(line, PAD, y+16);
    y += 24;
  });
  y += 8;
  return y;
}

/* ---------- 完整版：逐項列出（可能較長）---------- */
function drawFullReport(ctx, sample, W){
  const PAD = 40;
  const contentW = W - PAD*2;
  ctx.fillStyle = "#221913";
  ctx.fillRect(0,0,W,100000);
  let y = drawHeader(ctx, sample, W, PAD);
  let anyContent = false;

  CATS.forEach((cat,ci)=>{
    const markedItems = [];
    cat.items.forEach((it,ii)=>{
      const arr = sample.marks[itemId(ci,ii)];
      if(arr && arr.some(v=>v>0)) markedItems.push({name:it[0], marks:arr});
    });
    if(markedItems.length===0) return;
    anyContent = true;

    ctx.font = '700 14px "Noto Serif TC", serif';
    ctx.fillStyle = cat.neg ? "#c98a7a" : "#d9a441";
    drawSpaced(ctx, cat.name, PAD, y+14, 3);
    y += 28;

    markedItems.forEach(item=>{
      ctx.font = '400 16px "Noto Sans TC", sans-serif';
      const nameLines = wrapCJK(ctx, item.name, 180);
      const rowH = Math.max(44, nameLines.length*22+14);
      ctx.fillStyle = "#efe4d0";
      nameLines.forEach((line,li)=>{ ctx.fillText(line, PAD, y+22+li*22); });

      let chipX = PAD + 200;
      TEMP_LABELS.forEach((label0,t)=>{
        const v = item.marks[t];
        if(!v) return;
        const label = label0 + " " + MARKS[v];
        ctx.font = '700 13px "Noto Sans TC", sans-serif';
        const tw = ctx.measureText(label).width;
        const chipW = tw + 16, chipH = 26;
        const chipY = y + rowH/2 - chipH/2;
        const c = levelColor(v, cat.neg);
        ctx.fillStyle = c.bg;
        roundRect(ctx, chipX, chipY, chipW, chipH, 8);
        ctx.fill();
        ctx.fillStyle = c.fg;
        ctx.fillText(label, chipX+8, chipY+18);
        chipX += chipW + 8;
      });

      y += rowH;
      ctx.strokeStyle = "rgba(60,47,31,0.6)";
      ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke();
    });
    y += 14;
  });

  if(!anyContent){
    ctx.font = '400 15px "Noto Sans TC", sans-serif';
    ctx.fillStyle = "#8a7c66";
    ctx.fillText("尚未記錄任何香氣項目", PAD, y+20);
    y += 50;
  }

  y = drawNotesFrom(ctx, y, W, PAD, contentW, sample);
  y = drawFooterFrom(ctx, y, W, PAD);
  return y;
}

/* ---------- 精簡摘要版：固定大小熱區 + 重點強項 ---------- */
function drawCompactReport(ctx, sample, W){
  const PAD = 40;
  const contentW = W - PAD*2;
  ctx.fillStyle = "#221913";
  ctx.fillRect(0,0,W,100000);
  let y = drawHeader(ctx, sample, W, PAD);

  // 彙整每個分類：每個溫度的最高強度，以及有勾選的項目名稱
  const catGrid = CATS.map((cat,ci)=>{
    const levels = [0,0,0,0,0];
    const namedItems = [];
    cat.items.forEach((it,ii)=>{
      const arr = sample.marks[itemId(ci,ii)];
      if(arr && arr.some(v=>v>0)){
        for(let t=0;t<5;t++){ if(arr[t]>levels[t]) levels[t]=arr[t]; }
        namedItems.push({name:it[0], maxLv:Math.max(...arr)});
      }
    });
    return {name:cat.name, short:cat.short, neg:cat.neg, levels, namedItems};
  }).filter(row=>row.namedItems.length>0);

  ctx.font = '700 13px "Noto Serif TC", serif';
  ctx.fillStyle = "#d9a441";
  drawSpaced(ctx, "分類 × 溫度　強度總覽", PAD, y+13, 2);
  y += 30;

  if(catGrid.length===0){
    ctx.font = '400 15px "Noto Sans TC", sans-serif';
    ctx.fillStyle = "#8a7c66";
    ctx.fillText("尚未記錄任何香氣項目", PAD, y+20);
    y += 50;
  } else {

  const labelW = 96;
  const cellGap = 6;
  const cellW = (contentW - labelW - cellGap*4) / 5;
  const cellH = 32;

  // 欄標題（完整詞彙，避免只看縮寫看不懂）
  ctx.font = '500 12px "Noto Sans TC", sans-serif';
  ctx.fillStyle = "#8a7c66";
  ctx.textAlign = "center";
  TEMP_LABELS.forEach((label,t)=>{
    const cx = PAD + labelW + t*(cellW+cellGap) + cellW/2;
    ctx.fillText(label, cx, y+11);
  });
  ctx.textAlign = "left";
  y += 22;

  let negFlagCount = 0;

  catGrid.forEach(row=>{
    if(row.neg) negFlagCount += row.namedItems.length;

    // 熱區列：分類名稱 + 5 個溫度格
    ctx.font = '600 13px "Noto Sans TC", sans-serif';
    ctx.fillStyle = row.neg ? "#c98a7a" : "#c9bda3";
    ctx.fillText(row.short, PAD, y + cellH/2 + 5);

    row.levels.forEach((lv,t)=>{
      const cx = PAD + labelW + t*(cellW+cellGap);
      const c = levelColor(lv, row.neg);
      ctx.fillStyle = c.bg;
      roundRect(ctx, cx, y, cellW, cellH, 8);
      ctx.fill();
      ctx.strokeStyle = c.bd;
      ctx.lineWidth = 1;
      roundRect(ctx, cx, y, cellW, cellH, 8);
      ctx.stroke();
      if(lv>0){
        ctx.font = '700 13px "Noto Sans TC", sans-serif';
        ctx.fillStyle = c.fg;
        ctx.textAlign = "center";
        ctx.fillText(MARKS[lv], cx+cellW/2, y+cellH/2+5);
        ctx.textAlign = "left";
      }
    });
    y += cellH + 6;

    // 名稱列：這個分類底下實際勾選了哪些香味，各自附強度符號
    ctx.font = '400 13px "Noto Sans TC", sans-serif';
    const nameText = row.namedItems.map(it=> it.name + MARKS[it.maxLv]).join("　・　");
    const nameColor = row.neg ? "#e0a190" : "#dcd0ba";
    ctx.fillStyle = nameColor;
    const nameLines = wrapCJK(ctx, nameText, contentW - 4);
    nameLines.forEach(line=>{
      ctx.fillText(line, PAD+4, y+15);
      y += 21;
    });
    y += 14;
  });

  if(negFlagCount>0){
    ctx.strokeStyle = "#3c2f1f";
    ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke();
    y += 24;
    ctx.font = '500 13px "Noto Sans TC", sans-serif';
    ctx.fillStyle = "#c98a7a";
    ctx.fillText("⚠ 異雜氣：偵測到 "+negFlagCount+" 項需留意（見上方紅色列）", PAD, y+14);
    y += 28;
  }

  } // end catGrid.length check

  y = drawNotesFrom(ctx, y, W, PAD, contentW, sample);
  y = drawFooterFrom(ctx, y, W, PAD);
  return y;
}

/* ---------- 產生圖片 ---------- */
async function generateImage(){
  if(document.fonts && document.fonts.ready){
    try{ await document.fonts.ready; }catch(e){}
  }
  const W = 720;
  const sample = db.samples[db.cur];
  const compact = document.getElementById("compactMode").checked;
  const drawFn = compact ? drawCompactReport : drawFullReport;

  const scratch = document.createElement("canvas");
  scratch.width = W; scratch.height = 8000;
  const sctx = scratch.getContext("2d");
  const totalH = Math.ceil(drawFn(sctx, sample, W));

  const scale = 2;
  const final = document.createElement("canvas");
  final.width = W*scale;
  final.height = totalH*scale;
  const fctx = final.getContext("2d");
  fctx.scale(scale,scale);
  drawFn(fctx, sample, W);

  const url = final.toDataURL("image/jpeg", 0.92);
  const a = document.createElement("a");
  const safeName = (sample.name||"樣品").replace(/[\\/:*?"<>|]/g,"").trim() || "樣品";
  a.href = url;
  a.download = "老山檀評測-"+safeName+(compact?"-摘要":"-完整")+".jpg";
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast("圖片已產生");
}

document.getElementById("genimg").onclick = ()=>{ generateImage(); };

  document.getElementById("envtag").textContent = hasCloudStorage
    ? "☁ 目前於 Claude.ai 內，使用雲端儲存"
    : "💻 目前於一般網頁環境，使用本機瀏覽器儲存";
  const r = await storageGet(KEY);
  if(r && r.value){
    try{ db = JSON.parse(r.value); }catch(e){}
  }
  renderAll();
})();
</script>
